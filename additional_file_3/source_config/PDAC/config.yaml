feasibility_thresholds:
  tcga_rna_tumor_min: 120
  tcga_survival_min: 100
  cptac_proteomics_min: 30
  depmap_pdac_cell_lines_min: 15
  external_cohort_min: 2
  drug_mapping_min_fraction: 0.40
  id_mapping_min_fraction: 0.80
  literature_benchmark_min_sources: 2

scoring:
  mode: "auto"
  primary_method: "pillar_geometric_mean_with_safety_penalty"
  use_fixed_weights_as_primary: false
  use_proteomics_if_available: true
  geometric_mean_epsilon: 1.0e-6
  pillars:
    disease_relevance:
      standard_components:
        - patient_alteration_score
        - proteomic_support_score
        - external_reproducibility_score
      minimal_components:
        - patient_alteration_score
        - external_reproducibility_score
    core_priority:
      components:
        - disease_relevance_score
        - dependency_score
        - druggability_score
    safety:
      risk_score: safety_risk_score
      factor_formula: "1 - safety_risk_score"
  robustness:
    random_weight_sets: 1000
    leave_one_evidence_out: true
    report_top_n_frequency: [10, 20, 50]

visualization:
  dpi: 300
  save_pdf: true
  save_png: true
  top_n_heatmap: 30
  top_n_dependency: 30
  top_n_target_cards: 6
